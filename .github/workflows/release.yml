name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

jobs:
  build:
    runs-on: [self-hosted, beta, public-release]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8
        with:
          version: 10
          run_install: false
      - run: pnpm install --ignore-scripts
      - run: pnpm run build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish-npm:
    needs: build
    runs-on: ubuntu-latest # npmjs doesn't support self-hosted runners
    environment: release
    permissions:
      contents: read
      id-token: write # Required for npm OIDC Trusted Publishing
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - run: npm publish --provenance --access public

  github-release:
    needs: publish-npm
    runs-on: [self-hosted, beta, public-release]
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PRERELEASE=""
          if [[ "$TAG_NAME" == *"beta"* ]] || [[ "$TAG_NAME" == *"alpha"* ]] || [[ "$TAG_NAME" == *"rc"* ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$TAG_NAME" --generate-notes $PRERELEASE
